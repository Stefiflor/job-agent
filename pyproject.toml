[project]
name = "job-agent"
version = "0.1.0"
description = "Agente que busca ofertas remotas y las evalúa contra un CV con Claude"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "model2vec>=0.10",
    "psycopg[binary]>=3.2",
    "pgvector>=0.4",
    "numpy>=2",
]

[project.scripts]
job-agent = "job_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]
